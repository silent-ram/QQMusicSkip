name: 功能建议
description: 建议新的规则、界面或播放功能
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用问题
      description: 这个功能希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互和行为。
    validations:
      required: true
